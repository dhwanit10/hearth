<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Hearth - private AI companions that text back like people."
    />
    <title>Hearth</title>
    <script>
      // Resolve the theme before first paint so there is never a light flash.
      (function () {
        try {
          var saved = localStorage.getItem("hearth.theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : prefersDark
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          /* first paint in light is an acceptable fallback */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
