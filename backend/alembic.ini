# Alembic configuration for the Hearth backend.
#
# The database URL is NOT read from here: ``migrations/env.py`` pulls it from the
# application settings (``DATABASE_URL`` in ``backend/.env``), so a single place
# configures both the app and migrations. The value below is only a fallback for
# the plain ``alembic`` CLI.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/hearth

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
